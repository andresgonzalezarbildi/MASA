[build]
  publish = "."

# Proxy de solo lectura para evitar bloqueos CORS/CSP al consultar productos.
[[redirects]]
  from = "/api/open-food-facts/:code"
  to = "https://world.openfoodfacts.org/api/v2/product/:code.json"
  status = 200
  force = true

# Fuerza la barra final para que las rutas relativas de CSS, JS y datos
# se resuelvan dentro de /masa/.
[[redirects]]
  from = "/masa"
  to = "/masa/"
  status = 301
  force = true

# Mantiene las páginas legales dentro de /masa/ sin cambiar la URL visible.
[[redirects]]
  from = "/masa/privacy.html"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/masa/terms.html"
  to = "/terms.html"
  status = 200
  force = true

# Publica esta carpeta también bajo /masa sin duplicar archivos.
[[redirects]]
  from = "/masa/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # MASA_SECURITY_HEADERS_V1
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.sheetjs.com https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: https://images.openfoodfacts.org; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://world.openfoodfacts.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/masa/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"


# Evita conservar una configuración anterior después de una rotación.
[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/masa/js/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
