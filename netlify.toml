[build]
  publish = "."

# Fuerza la barra final para que las rutas relativas de CSS, JS y datos
# se resuelvan dentro de /masa/.
[[redirects]]
  from = "/masa"
  to = "/masa/"
  status = 301
  force = true

# Publica esta carpeta también bajo /masa sin duplicar archivos.
[[redirects]]
  from = "/masa/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.sheetjs.com https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/masa/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
